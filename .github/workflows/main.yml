name: CI
on: [push]
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: true

      - run: pnpm run lint

  check-ts:
    runs-on: ubuntu-latest
    name: Check Types
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: true

      - run: pnpm run check

  check-format:
    runs-on: ubuntu-latest
    name: Check Formatting
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: true

      - run: pnpm run format:check

  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: true

      - name: Install Playwright browser
        run: pnpm --filter @uzh-bf/design-system test:install

      # Smoke only in CI for now: it is fast and reliable. The axe a11y sweep
      # (pnpm test:a11y) surfaced real candidate issues that still need triage
      # (real vs render-timing) before it can gate — tracked in the test plan.
      - name: Run Playwright smoke tests
        run: pnpm --filter @uzh-bf/design-system test:smoke

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/design-system/playwright-report/
          retention-days: 14

  a11y:
    runs-on: ubuntu-latest
    name: A11y (shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: true

      - name: Install Playwright browser
        run: pnpm --filter @uzh-bf/design-system test:install

      - name: Build Ladle
        run: pnpm --filter @uzh-bf/design-system build:ladle

      # Blocking axe sweep over every story x theme, at serious+critical. Known
      # debt is waived in tests/a11y/stories.spec.ts (A11Y-17..23); anything new
      # fails the build. Sharded four ways so no single runner is starved into
      # timeouts, which is the only way this suite goes red without a real
      # violation; retries:1 (playwright.config.ts, CI only) absorbs a stray one.
      - name: Run axe a11y sweep
        working-directory: packages/design-system
        env:
          PWTEST_SKIP_BUILD: "1"
        run: pnpm exec playwright test tests/a11y --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y-${{ matrix.shard }}
          path: packages/design-system/playwright-report/
          retention-days: 14

  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    needs: [check-ts, test, a11y]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: true

      - name: Build
        working-directory: packages/design-system
        run: pnpm run build

      # Release guard (ARCH-1): only version tags (v<semver>) publish, the git
      # tag must match the design-system package version, and the npm dist-tag
      # is derived from the prerelease id so a prerelease (e.g. v5.0.0-alpha.2)
      # can never overwrite the `latest` tag. Without this, a tag push defaulted
      # to publishing onto `latest`, clobbering the stable release.
      - name: Resolve npm dist-tag and verify tag matches package version
        id: release_meta
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/design-system
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          GIT_TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$GIT_TAG" ]; then
            echo "::error::Git tag '${GITHUB_REF_NAME}' does not match packages/design-system version '${PKG_VERSION}'. Refusing to publish."
            exit 1
          fi
          # Strip build metadata (everything after '+') before inspecting the
          # prerelease, so a '+build' suffix can never be misread as a dist-tag.
          VERSION_CORE="${PKG_VERSION%%+*}"
          if [[ "$VERSION_CORE" == *-* ]]; then
            PRERELEASE="${VERSION_CORE#*-}"   # e.g. alpha.2
            DIST_TAG="${PRERELEASE%%.*}"      # e.g. alpha
            # A prerelease whose id is literally 'latest' (e.g. 5.0.0-latest.1)
            # would otherwise resolve DIST_TAG=latest and clobber the stable tag
            # this guard exists to protect. Reject the reserved value outright.
            if [ "$DIST_TAG" = "latest" ]; then
              echo "::error::Prerelease id resolves to the reserved dist-tag 'latest'. Refusing to publish."
              exit 1
            fi
          else
            DIST_TAG="latest"
          fi
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${PKG_VERSION} to npm dist-tag '${DIST_TAG}'"

      - uses: JS-DevTools/npm-publish@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          token: ${{ secrets.NPM_TOKEN }}
          access: public
          tag: ${{ steps.release_meta.outputs.dist_tag }}
          package: packages/design-system/package.json

      - uses: JS-DevTools/npm-publish@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          registry: https://npm.pkg.github.com
          access: public
          tag: ${{ steps.release_meta.outputs.dist_tag }}
          package: packages/design-system/package.json
