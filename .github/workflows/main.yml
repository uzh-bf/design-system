name: CI
on:
  push:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: true

      - run: pnpm run lint

  check-ts:
    runs-on: ubuntu-latest
    name: Check Types
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: true

      - run: pnpm run check

  check-format:
    runs-on: ubuntu-latest
    name: Check Formatting
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: true

      - run: pnpm run format:check

  test:
    runs-on: ubuntu-latest
    name: Test
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: true

      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(pnpm --filter @uzh-bf/design-system exec playwright --version | awk '{print $NF}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The browser bundle is downloaded from a CDN on every run otherwise, and
      # that download is the least reliable thing in this workflow. The key
      # carries the resolved Playwright version, so a dependency bump misses the
      # cache and repopulates it instead of restoring browsers for the wrong
      # release.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        timeout-minutes: 17
        run: bash .github/scripts/install-playwright-browser.sh

      # Packed CSS ownership tracer: builds and packs the package, then asserts
      # the computed-token contract matrix from the packed ./css artifact in
      # Chromium (no Ladle). Runs after browser setup; `test:fast` does not
      # discover it implicitly.
      - name: Run packed theme contract tests
        run: pnpm --filter @uzh-bf/design-system test:theme-contract

      # Smoke stays in this job: it is fast and reuses the build here. The full
      # axe a11y sweep runs as its own sharded `a11y` job (below) that gates
      # `build`, so the heavy scan does not slow this job down.
      - name: Run Playwright smoke tests
        run: pnpm --filter @uzh-bf/design-system test:smoke

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/design-system/playwright-report/
          retention-days: 14

  a11y:
    runs-on: ubuntu-latest
    name: A11y (shard ${{ matrix.shard }}/4)
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: true

      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(pnpm --filter @uzh-bf/design-system exec playwright --version | awk '{print $NF}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Four shards multiply the exposure: without this cache each one downloads
      # the same browser bundle independently, so a single bad CDN response
      # stalls the whole gate.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        timeout-minutes: 17
        run: bash .github/scripts/install-playwright-browser.sh

      - name: Build Ladle
        run: pnpm --filter @uzh-bf/design-system build:ladle

      # Blocking axe sweep over every story x theme, at serious+critical. The
      # checked-in exact inventory fails on any unexpected, missing, or changed
      # tuple. Sharded four ways so no single runner is starved into timeouts;
      # retries:1 (playwright.config.ts, CI only) absorbs a stray one.
      - name: Run axe a11y sweep
        working-directory: packages/design-system
        env:
          PWTEST_SKIP_BUILD: "1"
          A11Y_PREFLIGHT: "1"
          A11Y_INVENTORY_OUTPUT: ${{ runner.temp }}/a11y-inventory-${{ matrix.shard }}.jsonl
          A11Y_COVERAGE_OUTPUT: ${{ runner.temp }}/a11y-coverage-${{ matrix.shard }}.jsonl
        run: pnpm exec playwright test tests/a11y --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y-${{ matrix.shard }}
          path: packages/design-system/playwright-report/
          retention-days: 14

      - name: Upload normalized a11y inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: a11y-inventory-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/a11y-inventory-${{ matrix.shard }}.jsonl
            ${{ runner.temp }}/a11y-coverage-${{ matrix.shard }}.jsonl
          retention-days: 14

  a11y-protocol:
    runs-on: ubuntu-latest
    name: A11y Inventory Protocol
    needs: a11y
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Use Node 22
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: true

      - name: Download a11y shard inventories
        uses: actions/download-artifact@v4
        with:
          pattern: a11y-inventory-*
          merge-multiple: true
          path: ${{ runner.temp }}/a11y-artifacts

      # Cross-shard closure of the sharded axe sweep: only the four shard
      # artifacts together reproduce the checked-in exact inventory and cover
      # every story x theme pair. Each shard on its own passes with whatever
      # subset it happened to scan, so without this job a shrunken scan (fewer
      # stories, fewer themes, a missing shard artifact) lands green.
      - name: Assert a11y inventory protocol
        working-directory: packages/design-system
        run: pnpm run test:a11y:protocol ${{ runner.temp }}/a11y-artifacts

  visual-regression:
    runs-on: ubuntu-latest
    name: Visual Regression
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Show pinned VRT image and platform
        run: |
          echo "Playwright image: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:111dde95859f2c659291cb60e698f9048a8fc30b35b4ddb7c90f9cb5b73062d9"
          echo "Platform: linux/amd64"

      # Blocking: a visual mismatch fails this job, and `build` needs it, so an
      # unreviewed pixel change can no longer reach the publish path. The
      # evidence below still uploads on failure through `!cancelled()`.
      - name: Run deterministic visual comparison
        run: bash packages/design-system/scripts/visual-regression.sh

      - name: Upload visual regression report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report-${{ github.sha }}
          path: packages/design-system/visual/playwright-report/
          # The HTML report is the required evidence for the now-blocking job:
          # a missing report means the comparison never produced a verdict.
          if-no-files-found: error
          retention-days: 14

      - name: Upload visual regression test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-test-results-${{ github.sha }}
          path: packages/design-system/visual/test-results/
          # Traces and diffs only exist for failures, so a green run leaves this
          # directory empty (except the hidden .last-run.json, which upload
          # ignores). It must stay `warn` or every passing run would fail here.
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      [
        lint,
        check-ts,
        check-format,
        test,
        a11y,
        a11y-protocol,
        visual-regression,
      ]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: true

      - name: Build
        working-directory: packages/design-system
        run: pnpm run build

      - name: Check package size
        run: pnpm run size:check

  publish:
    name: Publish
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.30.0
          run_install: true

      - name: Build
        working-directory: packages/design-system
        run: pnpm run build

      - name: Check package size
        run: pnpm run size:check

      # Release guard (ARCH-1): only version tags (v<semver>) publish, the git
      # tag must match the design-system package version, and the npm dist-tag
      # is derived from the prerelease id so a prerelease (e.g. v5.0.0-alpha.2)
      # can never overwrite the `latest` tag. Without this, a tag push defaulted
      # to publishing onto `latest`, clobbering the stable release.
      - name: Resolve npm dist-tag and verify tag matches package version
        id: release_meta
        working-directory: packages/design-system
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          GIT_TAG="${RELEASE_REF#v}"
          if [ "$PKG_VERSION" != "$GIT_TAG" ]; then
            echo "::error::Release ref '${RELEASE_REF}' does not match packages/design-system version '${PKG_VERSION}'. Refusing to publish."
            exit 1
          fi
          # Strip build metadata (everything after '+') before inspecting the
          # prerelease, so a '+build' suffix can never be misread as a dist-tag.
          VERSION_CORE="${PKG_VERSION%%+*}"
          if [[ "$VERSION_CORE" == *-* ]]; then
            PRERELEASE="${VERSION_CORE#*-}"   # e.g. alpha.2
            DIST_TAG="${PRERELEASE%%.*}"      # e.g. alpha
            # A prerelease whose id is literally 'latest' (e.g. 5.0.0-latest.1)
            # would otherwise resolve DIST_TAG=latest and clobber the stable tag
            # this guard exists to protect. Reject the reserved value outright.
            if [ "$DIST_TAG" = "latest" ]; then
              echo "::error::Prerelease id resolves to the reserved dist-tag 'latest'. Refusing to publish."
              exit 1
            fi
          else
            DIST_TAG="latest"
          fi
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${PKG_VERSION} to npm dist-tag '${DIST_TAG}'"

      # npm Trusted Publisher authenticates this public publish through the
      # job's id-token: write permission; no long-lived npm token is needed.
      - uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          access: public
          tag: ${{ steps.release_meta.outputs.dist_tag }}
          package: packages/design-system/package.json
          provenance: true

      - uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          registry: https://npm.pkg.github.com
          access: public
          tag: ${{ steps.release_meta.outputs.dist_tag }}
          package: packages/design-system/package.json
